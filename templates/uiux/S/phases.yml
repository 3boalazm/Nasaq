# Phase checklist for size S, from spec section 5.2 (S column).
phases:
  - name: Discover
    items:
      - "Goal, audience, 3–5 references"
  - name: Define
    items:
      - "One problem statement, one flow"
  - name: Design
    items:
      - "Straight to hi-fi"
  - name: Validate
    items:
      - "Self-check: contrast, mobile, RTL"
  - name: Handoff
    items:
      - "Annotated screens"
